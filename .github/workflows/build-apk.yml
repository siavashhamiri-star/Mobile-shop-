name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Niko Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📜 Pre-Accept All Android SDK Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p ~/.android/licenses

          LIC_SDK="24333f8a637b3749d10737a45c042284371cd301\n84831b9409646a918e30573bab4c9c91346d8abd\nd975375043a5000ee56811716b2306779dbe56fc"
          LIC_TV="6010071946943d23dbb4f6a5d333aa27b8a65d9a"
          LIC_GDK="33b6a2b64607f11b759f320ef9dff4ae5c47d97a"
          LIC_INTEL="e986725930190b49d3e0003d034ec1143b710bee"
          LIC_PREVIEW="84831b9409646a918e30573bab4c9c91346d8abd"

          echo -e "$LIC_SDK" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "$LIC_TV" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "$LIC_GDK" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "$LIC_INTEL" > $ANDROID_HOME/licenses/intel-android-sysimage-license
          echo -e "$LIC_PREVIEW" > $ANDROID_HOME/licenses/android-sdk-preview-license

          cp $ANDROID_HOME/licenses/* ~/.android/licenses/ || true

          for SDK_BIN in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -f "$SDK_BIN" ]; then
              echo "Accepting licenses via $SDK_BIN..."
              yes | $SDK_BIN --licenses || true
            fi
          done

      - name: 📦 Build web and sync Capacitor
        run: |
          npm install --legacy-peer-deps
          cat <<EOF > .env
          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          APP_URL="${{ secrets.APP_URL }}"
          EOF
          npm run build
          npx cap sync android

      - name: 🐘 Setup Gradle Runner
        uses: gradle/actions/setup-gradle@v3

      - name: 📍 Pin Gradle to 8.11.1
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
          echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Bootstrapping Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1 || true
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          find app/build/outputs/apk -name "*.apk" || true

      - name: 🔍 Gradle failure diagnostics
        if: failure()
        run: |
          echo "=== GRADLE FAILURE DIAGNOSTICS ==="
          LOG_FILE="$GITHUB_WORKSPACE/build.log"
          if [ -f "$LOG_FILE" ]; then
            echo "--- Matching Errors from build.log ---"
            grep -n -A15 "What went wrong" "$LOG_FILE" || true
            grep -n "^e: \|error: \|FAILED" "$LOG_FILE" || true
            echo "--- Log Tail ---"
            tail -n 60 "$LOG_FILE" || true
          elif [ -f "android/build.log" ]; then
            grep -n -A15 "What went wrong" "android/build.log" || true
            tail -n 60 "android/build.log" || true
          else
            echo "build.log not found in workspace."
            find . -name "*.log" || true
          fi

      - name: 📤 Upload APK Artifact for Mobile Download
        uses: actions/upload-artifact@v4
        with:
          name: niko-mobile-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
