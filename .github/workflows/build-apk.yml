name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Niko Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache is omitted to guarantee success even if package-lock.json is missing or regenerated

      - name: 📦 Install Web Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Securely Inject Environment Secrets
        run: |
          echo "Injecting environment variables from repository secrets safely..."
          cat <<EOF > .env
          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          APP_URL="${{ secrets.APP_URL }}"
          EOF

      - name: 🏗️ Build Web Application (Vite Production)
        run: npm run build

      - name: ☕ Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Decode Keystore (Optional for Signed Release)
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🔨 Compile Android APK via Gradle
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug || gradle assembleDebug

      - name: 📤 Upload APK Artifact for Mobile Download
        uses: actions/upload-artifact@v4
        with:
          name: niko-mobile-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
