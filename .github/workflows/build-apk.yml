name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Niko Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Web Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Securely Inject Environment Secrets
        run: |
          echo "Injecting environment variables from repository secrets safely..."
          cat <<EOF > .env
          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          APP_URL="${{ secrets.APP_URL }}"
          EOF

      - name: 🏗️ Build Web Application (Vite Production)
        run: npm run build

      - name: ☕ Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📜 Pre-Accept All Android SDK Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p ~/.android/licenses

          LIC_SDK="24333f8a637b3749d10737a45c042284371cd301\n84831b9409646a918e30573bab4c9c91346d8abd\nd975375043a5000ee56811716b2306779dbe56fc"
          LIC_TV="6010071946943d23dbb4f6a5d333aa27b8a65d9a"
          LIC_GDK="33b6a2b64607f11b759f320ef9dff4ae5c47d97a"
          LIC_INTEL="e986725930190b49d3e0003d034ec1143b710bee"
          LIC_PREVIEW="84831b9409646a918e30573bab4c9c91346d8abd"

          echo -e "$LIC_SDK" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "$LIC_TV" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "$LIC_GDK" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "$LIC_INTEL" > $ANDROID_HOME/licenses/intel-android-sysimage-license
          echo -e "$LIC_PREVIEW" > $ANDROID_HOME/licenses/android-sdk-preview-license

          cp $ANDROID_HOME/licenses/* ~/.android/licenses/ || true

          for SDK_BIN in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -f "$SDK_BIN" ]; then
              echo "Accepting licenses via $SDK_BIN..."
              yes | $SDK_BIN --licenses || true
            fi
          done

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔑 Decode Keystore (Optional for Signed Release)
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🔨 Compile Android APK via Gradle
        working-directory: ./android
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew || true
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradle-wrapper.jar not found, compiling directly via Gradle CLI..."
            gradle assembleDebug --stacktrace
          fi

      - name: 📤 Upload APK Artifact for Mobile Download
        uses: actions/upload-artifact@v4
        with:
          name: niko-mobile-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
